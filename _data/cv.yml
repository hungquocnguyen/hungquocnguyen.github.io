  summary: Materials scientist and electrochemist with a Ph.D. from NTNU, specializing in next-generation battery chemistries (Li-ion, Na-ion, Li-S, Na-S and all-solid-state), operando X-ray techniques and chemo-mechanical diagnostics. Designed pressure-control operando cells for XRD and XAS, and led 15+ synchrotron beamtimes at ESRF, DESY and SOLARIS.

