      - company: Norwegian University of Science and Technology (NTNU)
        position: PhD Researcher
        location: Trondheim, Norway
        start_date: 2021
        end_date: 2026
        highlights:
          - Investigated electro-chemo-mechanical coupling in all-solid-state Li-ion and Na-S batteries using operando synchrotron X-ray diffraction and absorption spectroscopy.
          - Designed and built operando electrochemical cells for synchrotron X-ray experiments; cell design licensed to RHD Instruments through NTNU TTO.
          - Led 10+ successful beamtime proposals and completed 15+ beamtimes at ESRF (France), DESY (Germany) and SOLARIS (Poland).
          - Collaborated with researchers across 8+ institutions in Norway, France, Germany, Austria, Poland and Spain.

      - company: Selex Motors Vietnam
